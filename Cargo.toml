[package]
name = "deid-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
zip = { version = "9.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
serde_json = "1.0.154"
