<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medical Record De-identifier</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
        background: #fff;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font: inherit;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 1.25rem;
        font: inherit;
        cursor: pointer;
      }
      #output {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #bbb;
        padding: 0.75rem;
        min-height: 3rem;
        background: #f6f6f6;
      }
      #error {
        color: #b00020;
      }
    </style>
  </head>
  <body>
    <h1>Medical Record De-identifier</h1>

    <label for="input">Medical record text</label>
    <textarea id="input" placeholder="Paste a medical record here"></textarea>
    <button id="process" type="button">Process</button>

    <h2>Result</h2>
    <pre id="output" aria-live="polite"></pre>
    <p id="error" role="alert"></p>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
