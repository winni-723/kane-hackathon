<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Medical Record De-identifier</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 2rem auto;
        padding: 0 1rem;
        color: #1a1a1a;
        background: #fff;
      }
      textarea {
        width: 100%;
        min-height: 180px;
        font: inherit;
        padding: 0.5rem;
        box-sizing: border-box;
      }
      button {
        margin-top: 0.75rem;
        padding: 0.5rem 1.25rem;
        font: inherit;
        cursor: pointer;
      }
      #output {
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        border: 1px solid #bbb;
        padding: 0.75rem;
        min-height: 3rem;
        background: #f6f6f6;
      }
      .starters {
        margin-top: 1.5rem;
        padding-top: 0.75rem;
        border-top: 1px solid #ddd;
        font-size: 0.95rem;
      }
      .starters p {
        margin: 0;
      }
      .starters label {
        margin: 0 0.5rem;
      }
      .error {
        color: #b00020;
      }
      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <h1>Medical Record De-identifier</h1>

    <!-- Only one panel is on screen at a time, so the original text and the
         de-identified result never appear together. -->
    <section id="input-panel" aria-labelledby="input-heading">
      <h2 id="input-heading">Original record</h2>
      <label for="input">Medical record text</label>
      <textarea id="input" placeholder="Paste a medical record here"></textarea>
      <button id="process" type="button">Process</button>

      <!-- Kept after the Process button so the text box and Process stay the
           first controls in this panel. -->
      <div class="starters">
        <p>No record to hand? Start from one of these:</p>
        <button id="sample" type="button">Load sample record</button>
        <label for="file">or choose a .txt file</label>
        <input id="file" type="file" accept=".txt,text/plain" />
      </div>
    </section>

    <section id="result-panel" aria-labelledby="result-heading" hidden>
      <h2 id="result-heading">Result</h2>
      <pre id="output" aria-label="De-identified result" aria-live="polite"></pre>
      <button id="download" type="button">Download result</button>
      <button id="edit" type="button">Edit original</button>
    </section>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
