name: Keep the live site awake

# The free Render instance sleeps after 15 quiet minutes and takes about a
# minute to wake. A request every 10 minutes keeps it ready for visitors.
# Records are de-identified in the visitor's browser, so the check is that
# the deployed page still serves its script, the engine's worker and the
# engine itself, and that the server has no route that takes a record.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Load the page, its script, the engine worker and the engine
        run: |
          url=https://medical-record-deidentifier.onrender.com
          get() { curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 -o "$2" "$url$1"; }
          get / page.html
          grep -q "Medical Record De-identifier" page.html
          script=$(grep -oE '/assets/index-[A-Za-z0-9_-]+\.js' page.html | sed -n 1p)
          get "$script" script.js
          worker=$(grep -oE '/assets/engine-worker-[A-Za-z0-9_-]+\.js' script.js | sed -n 1p)
          get "$worker" worker.js
          engine=$(grep -oE '/assets/engine_bg-[A-Za-z0-9_-]+\.wasm' worker.js | sed -n 1p)
          get "$engine" engine.wasm
          echo "script $script, worker $worker, engine $engine"
          # A WebAssembly file starts with the bytes \0asm.
          [ "$(od -An -c -N 4 engine.wasm | tr -d ' ')" = '\0asm' ]
      - name: The server takes no record
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -X POST \
            -H 'Content-Type: application/json' -d '{"text":"Diagnosis: Migraine."}' \
            https://medical-record-deidentifier.onrender.com/api/process)
          echo "POST /api/process -> $code"
          case "$code" in 2*) echo "the server accepted a record"; exit 1 ;; esac
