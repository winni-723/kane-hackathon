name: Keep the live site awake

# The free Render instance sleeps after 15 quiet minutes and takes about a
# minute to wake. A request every 10 minutes keeps it ready for visitors, and
# sending one record through shows the deployed build still de-identifies.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Load the page and send one record through
        run: |
          url=https://medical-record-deidentifier.onrender.com
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 120 "$url/" \
            | grep -q "Medical Record De-identifier"
          out=$(curl -fsS --max-time 60 -X POST -H 'Content-Type: application/json' \
            -d '{"text":"Name: Eleanor Carter\nPhone: (617) 555-0142\nDiagnosis: Migraine without aura."}' \
            "$url/api/process")
          echo "$out"
          echo "$out" | grep -q '\[NAME\]'
          echo "$out" | grep -q 'Migraine without aura'
          if echo "$out" | grep -q 'Eleanor'; then echo "name leaked"; exit 1; fi
